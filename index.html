<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Contatti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Gestione Contatti</h1>

<h3>Aggiungi utente</h3>
<input type="text" id="nome" placeholder="Nome">
<input type="email" id="email" placeholder="Email">
<button onclick="inviaDati()">Salva</button>

<p id="risposta"></p>

<h3>Lista utenti</h3>
<table border="1">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Data</th>
            <th>Azione</th>
        </tr>
    </thead>
    <tbody id="tabella"></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
